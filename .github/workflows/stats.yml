name: Update profile visuals

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  visuals:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&theme=transparent&hide_border=true&include_all_commits=true&count_private=true&title_color=67E8F9&text_color=94A3B8&icon_color=A78BFA
          path: profile/stats.svg
          token: ${{ secrets.README_STATS_TOKEN || github.token }}
          fail_on_error: true

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&theme=transparent&hide_border=true&count_private=true&title_color=67E8F9&text_color=94A3B8
          path: profile/top-langs.svg
          token: ${{ secrets.README_STATS_TOKEN || github.token }}
          fail_on_error: true

      - name: Generate Plasma Dynamic Wallpaper card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=plasma-dynamic-wallpaper&theme=transparent&hide_border=true&title_color=67E8F9&text_color=94A3B8&icon_color=A78BFA
          path: profile/pin-plasma-dynamic-wallpaper.svg
          token: ${{ secrets.README_STATS_TOKEN || github.token }}
          fail_on_error: true

      - name: Generate Internship Finder card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=internship-finder&theme=transparent&hide_border=true&title_color=67E8F9&text_color=94A3B8&icon_color=A78BFA
          path: profile/pin-internship-finder.svg
          token: ${{ secrets.README_STATS_TOKEN || github.token }}
          fail_on_error: true

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/github-snake.svg
            profile/github-snake-dark.svg?palette=github-dark

      - name: Commit profile visuals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update profile visuals" || exit 0
          git push
