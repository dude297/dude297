<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Yingche Wee — EE/CS builder</title>
  <desc id="desc">Profile banner for Yingche Wee featuring AI, systems, and embedded engineering themes.</desc>
  <defs>
    <linearGradient id="bg" x1="52" y1="22" x2="1130" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1020"/>
      <stop offset="0.46" stop-color="#111A34"/>
      <stop offset="1" stop-color="#07151A"/>
    </linearGradient>
    <linearGradient id="accent" x1="150" y1="70" x2="990" y2="290" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientTransform="translate(1030 70) rotate(135) scale(280 220)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity=".24"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientTransform="translate(160 350) rotate(-50) scale(300 260)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED" stop-opacity=".25"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#A5B4FC" stroke-opacity=".06"/>
    </pattern>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="26" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="26" fill="url(#glowA)"/>
  <rect width="1200" height="360" rx="26" fill="url(#glowB)"/>

  <g opacity=".8">
    <path d="M820 72H930L974 116H1118" stroke="url(#accent)" stroke-width="2"/>
    <path d="M845 185H930L970 145H1088" stroke="url(#accent)" stroke-width="2"/>
    <path d="M760 266H900L946 220H1135" stroke="url(#accent)" stroke-width="2"/>
    <path d="M900 302V274L934 240" stroke="url(#accent)" stroke-width="2"/>
    <circle cx="820" cy="72" r="5" fill="#A78BFA"/>
    <circle cx="1118" cy="116" r="5" fill="#22D3EE"/>
    <circle cx="845" cy="185" r="5" fill="#34D399"/>
    <circle cx="1088" cy="145" r="5" fill="#22D3EE"/>
    <circle cx="760" cy="266" r="5" fill="#A78BFA"/>
    <circle cx="1135" cy="220" r="5" fill="#34D399"/>
    <circle cx="900" cy="302" r="5" fill="#22D3EE"/>
  </g>

  <g transform="translate(70 62)">
    <rect x="0" y="0" width="248" height="30" rx="15" fill="#111827" stroke="#334155"/>
    <circle cx="18" cy="15" r="5" fill="#34D399"/>
    <text x="31" y="20" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#CBD5E1" letter-spacing=".6">dude297 / engineering in public</text>

    <text x="0" y="98" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="52" font-weight="800" fill="#F8FAFC" letter-spacing="-1.5">YINGCHE WEE</text>
    <rect x="0" y="114" width="505" height="5" rx="2.5" fill="url(#accent)"/>

    <text x="0" y="160" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="23" font-weight="600" fill="#D8E3F4">EE / CS builder working across AI, systems &amp; hardware.</text>
    <text x="0" y="196" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" fill="#94A3B8">I like projects where reliability, constraints, and real-world execution matter.</text>

    <g transform="translate(0 228)">
      <rect width="166" height="34" rx="17" fill="#7C3AED" fill-opacity=".14" stroke="#A78BFA" stroke-opacity=".45"/>
      <text x="18" y="22" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#C4B5FD">AI AGENTS</text>
      <rect x="178" width="190" height="34" rx="17" fill="#0891B2" fill-opacity=".14" stroke="#22D3EE" stroke-opacity=".45"/>
      <text x="196" y="22" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#67E8F9">SYSTEMS + INFRA</text>
      <rect x="380" width="190" height="34" rx="17" fill="#059669" fill-opacity=".14" stroke="#34D399" stroke-opacity=".45"/>
      <text x="398" y="22" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#6EE7B7">EMBEDDED / FPGA</text>
    </g>
  </g>

  <g transform="translate(955 176)">
    <circle r="92" fill="#0B1220" stroke="#334155" stroke-width="2"/>
    <circle r="76" stroke="url(#accent)" stroke-width="2" stroke-dasharray="6 9"/>
    <circle r="58" fill="#101A2B" stroke="#1E293B"/>
    <path d="M-29 10L-8 -18L13 5L31 -25" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-29" cy="10" r="5" fill="#A78BFA"/>
    <circle cx="-8" cy="-18" r="5" fill="#60A5FA"/>
    <circle cx="13" cy="5" r="5" fill="#22D3EE"/>
    <circle cx="31" cy="-25" r="5" fill="#34D399"/>
    <text x="0" y="45" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#94A3B8" letter-spacing="2">BUILD → TEST → SHIP</text>
  </g>

  <rect x=".75" y=".75" width="1198.5" height="358.5" rx="25.25" stroke="#334155" stroke-opacity=".75" stroke-width="1.5"/>
</svg>